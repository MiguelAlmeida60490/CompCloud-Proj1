config:
#  target: 'https://cc26appnorwayeast4204.azurewebsites.net/rest'
  target: 'https://cc26appgermanywestcentral4204.azurewebsites.net/rest'
#  target: 'http://localhost:8080/rest'
  http:
    timeout: 30
  plugins:
    metrics-by-endpoint: {}
  processor: "./test-utils.js"
  phases:
  - name: "Test cookies"    # Test cookies
    duration: 1
    arrivalCount: 1

scenarios:
  - name: 'Test cookies'
    weight: 1
    flow:
      - function: "selectUserSkewed"
      - post:                          # First: login as a user
          url: "/user/auth"
          headers:
            Content-Type: application/json
          json:
            user: "{{ user }}"
            pwd: "{{ pwd }}"
      - get:                         
          url: "/user/{{ user }}"
          headers:
            Accept: application/json
      - get:                          
          url: "/ctrl/version"
